name: Publikuj artykuły AAA WIEM
on:
  push:
    branches: [main]
    paths:
      - 'content/artykuly/**'
      - 'scripts/build.py'
      - '.github/workflows/publikuj.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML markdown
      - run: python scripts/build.py
      - name: Zapisz wygenerowane strony
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' 'artykuly.json'
          if ! git diff --cached --quiet; then
            git commit -m "Automatyczna publikacja artykułów"
            git push
          fi
